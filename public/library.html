<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chit & Chat — Library</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .filter-tabs { display: flex; gap: 8px; margin-bottom: 20px; }
  .filter-tabs button.active { background: var(--brand-primary); color: #fff; }
  .lib-card video { width: 100%; border-radius: 8px; background: #000; margin-bottom: 10px; max-height: 180px; }
  .lib-card h4 { margin: 0 0 4px; }
  .lib-card .meta { color: #8a8a99; font-size: 0.8rem; margin-bottom: 10px; }
  .lib-card .actions { display: flex; flex-wrap: wrap; gap: 6px; }
  .lib-card .translations { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
</style>
</head>
<body>
  <header id="app-header" class="app-header"></header>
  <div class="container">
    <h1 class="page-title">Library</h1>
    <p class="page-sub">Every recording lives here — lessons, intro clips, and translated copies.</p>
    <div class="filter-tabs">
      <button class="btn btn-outline active" data-filter="all">All</button>
      <button class="btn btn-outline" data-filter="lesson">Lessons</button>
      <button class="btn btn-outline" data-filter="intro">Intro clips</button>
    </div>
    <div class="grid grid-cards" id="lib-grid"></div>

    <h2 class="page-title" style="font-size:1.3rem">Cloud library</h2>
    <p class="page-sub">Recordings backed up to your server — reachable from any device. <a href="settings.html">Connect a backend →</a></p>
    <div class="grid grid-cards" id="cloud-grid"></div>
  </div>
  <script src="js/auth.js"></script>
  <script src="js/brand.js"></script>
  <script src="js/api.js"></script>
  <script src="js/db.js"></script>
  <script src="js/library.js"></script>
</body>
</html>
