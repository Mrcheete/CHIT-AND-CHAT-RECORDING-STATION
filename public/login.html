<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chit & Chat — Log in</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .login-card { width: 100%; max-width: 360px; }
  .login-card h1 { margin-top: 0; font-size: 1.4rem; }
  .login-error { color: var(--brand-danger); font-size: 0.9rem; min-height: 1.2em; }
</style>
</head>
<body>
  <div class="login-wrap">
    <div class="card login-card">
      <h1>Chit & Chat Studio</h1>
      <form id="login-form">
        <div class="field">
          <label>Email</label>
          <input type="email" id="login-email" required autocomplete="username">
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="login-password" required autocomplete="current-password">
        </div>
        <p class="login-error" id="login-error"></p>
        <button type="submit" class="btn btn-primary" id="login-submit">Log in</button>
      </form>
    </div>
  </div>
  <script>
    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const button = document.getElementById("login-submit");
      const errorEl = document.getElementById("login-error");
      errorEl.textContent = "";
      button.disabled = true;
      button.textContent = "Logging in…";
      try {
        const res = await fetch("/api/login", {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email: document.getElementById("login-email").value,
            password: document.getElementById("login-password").value,
          }),
        });
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          errorEl.textContent = data.error || "Login failed.";
          return;
        }
        window.location.href = "index.html";
      } catch {
        errorEl.textContent = "Couldn't reach the server.";
      } finally {
        button.disabled = false;
        button.textContent = "Log in";
      }
    });
  </script>
</body>
</html>
